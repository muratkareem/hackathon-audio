name: Tests and lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install audio tools and Unicode fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install test dependencies without AI models
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --ignore-scripts --prefix frontend
      - name: Backend tests
        run: python -m pytest -q
      - name: Python lint and dependency consistency
        run: |
          python -m ruff check backend tests scripts
          python -m pip check
      - name: Frontend syntax and interaction tests
        run: |
          npm run check --prefix frontend
          npm test --prefix frontend
